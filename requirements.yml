---
# Collections required by the platform.
#
# Every version is pinned exactly. An unpinned collection is how a production
# build changes behaviour because a dependency shipped a release.
#
# CI gate: every ansible.builtin / <namespace>.<collection> referenced by a role
# must be declared here. An undeclared dependency resolves at build time from
# whatever happens to be installed, which is non-deterministic by construction.
#
# See docs/architecture/repository-structure.md section 13.

collections:
  # --- core ---------------------------------------------------------------
  # ansible.builtin is deliberately ABSENT. It is not an independently
  # installable collection: it is versioned with ansible-core and ships inside
  # it, and Galaxy publishes zero releases under ansible/builtin. Pinning it
  # here makes `ansible-galaxy collection install -r requirements.yml` fail
  # outright, with an error about the dependency map rather than about the
  # thing you got wrong. The ansible-core version is pinned where it belongs,
  # in the execution environment definition, because that is what actually
  # determines the bundled collection's version.

  # --- platform, DNS, crypto ----------------------------------------------
  - name: ansible.posix
    version: "1.5.4"
  - name: ansible.netcommon
    version: "6.1.0"
  - name: community.crypto
    version: "2.22.0"

  # --- Windows ------------------------------------------------------------
  - name: ansible.windows
    version: "2.3.0"

  # --- DNS ----------------------------------------------------------------
  - name: community.dns
    version: "2.7.0"

  # --- cloud providers ----------------------------------------------------
  # azure.azcollection, not community.azure: the collection was donated to the
  # azure namespace, and the old one is deprecated with a slower patch cadence.
  - name: azure.azcollection
    version: "2.5.0"
  - name: amazon.aws
    version: "8.2.0"
  - name: google.cloud
    version: "1.14.0"

  # --- general ------------------------------------------------------------
  - name: community.general
    version: "8.6.0"
