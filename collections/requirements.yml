---
# Collections required by the platform — installed into ./collections/
#
# This file is used by `ansible-galaxy collection install -r collections/requirements.yml -p collections/`
# to populate the project-local collections directory. It mirrors the root requirements.yml
# but ensures the local collections/ directory has exactly what the platform needs.
#
# Every version is pinned exactly. An unpinned collection is how a production
# build changes behaviour because a dependency shipped a release.
#
# CI gate: every ansible.builtin / <namespace>.<collection> referenced by a role
# must be declared here. An undeclared dependency resolves at build time from
# whatever happens to be installed, which is non-deterministic by construction.

collections:
  # --- platform, DNS, crypto ----------------------------------------------
  - name: ansible.posix
    version: "1.5.4"
  - name: ansible.netcommon
    version: "6.1.0"
  - name: community.crypto
    version: "2.22.0"

  # --- Windows ------------------------------------------------------------
  - name: ansible.windows
    version: "2.3.0"

  # --- DNS ----------------------------------------------------------------
  - name: community.dns
    version: "2.7.0"

  # --- cloud providers ----------------------------------------------------
  # azure.azcollection, not community.azure: the collection was donated to the
  # azure namespace, and the old one is deprecated with a slower patch cadence.
  - name: azure.azcollection
    version: "2.5.0"
  - name: amazon.aws
    version: "8.2.0"
  - name: google.cloud
    version: "1.14.0"

  # --- general ------------------------------------------------------------
  - name: community.general
    version: "8.6.0"

  # --- utilities ----------------------------------------------------------
  # ansible.utils provides filters/plugins used by the configuration resolver
  # and lookup table processing (e.g., dict2items, combine, json_query).
  - name: ansible.utils
    version: "6.1.1"