# Ansible configuration for the Server Build Automation Platform.
#
# Phase 1: structure only. This file makes the repository's path layout canonical
# for Ansible tooling (ansible-lint, ansible-playbook, Molecule) and pins the
# settings that the architecture depends on. See
# docs/architecture/repository-structure.md section 12.
#
# There is no secret in this file and none may be added to it. Vault passwords
# live outside the repository (see vault_password_file below).

[defaults]
# Control-plane inventories only. The servers being built are generated at run
# time from the run context (AD-18), never read from here.
inventory                   = inventories/dev

# collections_path: the project-local path first, so a role in ./roles always
# wins over an installed collection of the same name. This is what makes the
# AD-08 closed-dispatch guarantee survive an environment where the same
# collection name is installed globally.
collections_path            = collections:./roles:~/.ansible/collections
roles_path                  = roles

# NOT disabled. A build that trusts any host key will connect to whatever
# answers the hostname.
host_key_checking           = True

retry_files_enabled         = False
stdout_callback             = yaml
display_skipped_hosts       = False
gathering                   = smart
fact_caching                = jsonfile
fact_caching_connection     = .facts_cache
fact_caching_timeout        = 3600
interpreter_python          = auto_silent

# Outside the repository, always. A vault password in the repository is a vault
# password in Git.
vault_password_file         = ~/.vault_pass

deprecation_warnings         = True
forks                       = 20
timeout                     = 60
force_color                 = False

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
# Pipelining cuts round trips per module, which is a measurable difference over
# the WAN links this platform runs across.
pipelining   = True
scp_if_ssh   = smart
ssh_args     = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o PreferredAuthentications=publickey

[persistent_connection]
command_timeout = 60
connect_timeout = 30

[diff]
always = True
context = 3
