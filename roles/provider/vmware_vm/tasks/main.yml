---
# Main entrypoint for roles/provider/vmware_vm
- name: Provision VMware Virtual Machine
  when: sba_operation == 'provision'
  block:
    - name: Run preflight and lookup
      ansible.builtin.import_tasks: preflight.yml
      tags: [vmware_vm, provision, preflight]

    - name: Create or adopt
      ansible.builtin.import_tasks: create.yml
      tags: [vmware_vm, provision, create]

    - name: Read back and record
      ansible.builtin.import_tasks: record.yml
      tags: [vmware_vm, provision, record]

    - name: Converge and wait
      ansible.builtin.import_tasks: converge_wait.yml
      tags: [vmware_vm, provision, wait]

    - name: Assert postconditions
      ansible.builtin.import_tasks: assert.yml
      tags: [vmware_vm, provision, assert]

- name: Destroy VMware Virtual Machine
  when: sba_operation == 'destroy'
  block:
    - name: Decommission VM
      ansible.builtin.import_tasks: destroy.yml
      tags: [vmware_vm, destroy]
