# Cloud AWS VM Role - STUB
# Phase 1: AWS provider not yet implemented.
# This stub exists to maintain the provider contract interface.
# The provider_dispatch role routes 'aws' here, which fails fast with a clear message.

- name: "AWS VM — STUB: AWS provider not yet enabled in this phase"
  ansible.builtin.fail:
    msg: |
      AWS provider (cloud_aws_vm) is not yet enabled in Phase 1.
      
      This is a stub role that maintains the identical variable interface as cloud_gcp_vm
      so the provider abstraction holds for future implementation.
      
      To enable AWS:
      1. Replace this task with full implementation following the provider contract
      2. Implement the 6 task groups: lookup, create/adopt, converge, post-provision, decommission, verify
      3. Add AWS lookup tables in group_vars/all/ (aws_account_map, aws_region_map, etc.)
      4. Add amazon.aws to collections/requirements.yml (already present)
      5. Update provider_dispatch to route 'aws' to this role (already configured)
      
      Provider contract reference: docs/architecture/provider-abstraction.md
  tags: [cloud_aws_vm, stub]