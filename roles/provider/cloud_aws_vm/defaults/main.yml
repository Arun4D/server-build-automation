---
# Cloud AWS VM Role Defaults - STUB
# Shared defaults for AWS VM provisioning (when implemented).
# These mirror the cloud_gcp_vm defaults to maintain interface parity.

# Operation to perform
sba_operation: "provision"

# Retry and timeout settings (shared across all providers)
sba_retry_attempts: 3
sba_retry_delay: 5
sba_delete_timeout: 1800
sba_wait_ready_timeout: 3600

# AWS-specific defaults (placeholders for future implementation)
aws_allow_public_ip: false
aws_public_ip_justification: ""

aws_root_volume_size_gb: 30
aws_root_volume_type: "gp3"

aws_encryption: true
aws_encryption_kms_key_id: ""

aws_delete_timeout: 1800

# Security group tags
aws_security_group_tags: []

# Data volumes (optional)
aws_data_volumes: []

# OS family for wait_for_ready
aws_os_family: "{{ os_family }}"