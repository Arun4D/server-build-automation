---
# B (continued) — Read back observed state and record into sba_facts
- name: Read back VM info
  azure.azcollection.azure_rm_virtualmachine_info:
    resource_group: "{{ sba_resource_group }}"
    name: "{{ sba_name }}"
  register: sba_observed_azure
  changed_when: false
  tags: [azure_vm, record]

- name: Read back NIC info for private IP
  azure.azcollection.azure_rm_networkinterface_info:
    resource_group: "{{ sba_resource_group }}"
    name: "nic-{{ sba_name }}"
  register: sba_observed_nic
  changed_when: false
  tags: [azure_vm, record]

- name: Record observed state into sba_facts
  ansible.builtin.set_fact:
    sba_facts:
      server:
        instance_id: "{{ sba_observed_azure.vms[0].id | default('') }}"
        state: "{{ sba_observed_azure.vms[0].power_state | default('running') }}"
        private_ip: "{{ sba_observed_nic.networkinterfaces[0].ip_configurations[0].private_ip_address | default('') }}"
        fqdn: "{{ sba_fqdn }}"
      network:
        private_ip: "{{ sba_observed_nic.networkinterfaces[0].ip_configurations[0].private_ip_address | default('') }}"
        vnet_id: "{{ sba_vnet_name }}"
        subnet_id: "{{ sba_subnet_name }}"
      image:
        applied_image_id: "{{ sba_image_reference.publisher | default('') }}:{{ sba_image_reference.offer | default('') }}:{{ sba_image_reference.sku | default('') }}"
      tags:
        applied: "{{ sba_observed_azure.vms[0].tags | default({}) }}"
        verified: true
  tags: [azure_vm, record]
