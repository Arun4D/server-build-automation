---
# Tasks for roles/image/hyperv_image
- name: Fail when the catalogue entry is missing
  ansible.builtin.fail:
    msg: "sba_catalog_image is empty. The template comes from the reviewed catalogue."
  when: sba_catalog_image | length == 0

- name: Fail when the catalogue entry names no source VHDX
  ansible.builtin.fail:
    msg: "Catalogue entry has no source_vhd. An entry must pin an exact template."
  when: sba_source_vhd | length == 0

- name: Export verified image fact
  ansible.builtin.set_fact:
    sba_image_reference: "{{ sba_source_vhd }}"
    sba_image_verified: true
