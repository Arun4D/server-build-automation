---
# Tasks for roles/image/azure_image
# Validates and resolves Azure marketplace or shared image gallery reference

- name: Fail when the catalogue entry is missing
  ansible.builtin.fail:
    msg: "sba_catalog_image is empty. The image comes from the reviewed catalogue."
  when: sba_catalog_image | length == 0

- name: Fail when the catalogue entry names no publisher
  ansible.builtin.fail:
    msg: "Catalogue entry has no image publisher. An entry must pin an exact image."
  when: sba_image_publisher | length == 0

- name: Export verified image fact
  ansible.builtin.set_fact:
    sba_image_reference:
      publisher: "{{ sba_image_publisher }}"
      offer: "{{ sba_image_offer }}"
      sku: "{{ sba_image_sku }}"
      version: "{{ sba_image_version }}"
    sba_image_verified: true
