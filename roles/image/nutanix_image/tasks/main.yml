---
# Tasks for roles/image/nutanix_image
- name: Fail when the catalogue entry is missing
  ansible.builtin.fail:
    msg: "sba_catalog_image is empty. The image comes from the reviewed catalogue."
  when: sba_catalog_image | length == 0

- name: Fail when the catalogue entry names no image
  ansible.builtin.fail:
    msg: "Catalogue entry has no image_name. An entry must pin an exact image."
  when: sba_image_name | length == 0

- name: Export verified image fact
  ansible.builtin.set_fact:
    sba_image_reference: "{{ sba_image_name }}"
    sba_image_verified: true
