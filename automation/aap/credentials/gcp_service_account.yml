---
# AAP Credential: GCP Service Account
# Defines the credential type for GCP authentication in AAP.
# This is used by job templates to authenticate to GCP.
# The actual service account JSON is stored securely in AAP, not in this file.

credential_type:
  name: "GCP Service Account"
  description: "Google Cloud Platform Service Account credential for VM provisioning"
  kind: "cloud"
  inputs:
    fields:
      - id: service_account_json
        type: string
        label: "Service Account JSON"
        secret: true
        multiline: true
        help_text: "JSON key for the GCP service account with Compute Admin, Service Account User roles"
      - id: project_id
        type: string
        label: "GCP Project ID"
        secret: false
        help_text: "GCP project ID where VMs will be provisioned"
    required:
      - service_account_json
      - project_id
  injectors:
    env:
      GCP_SERVICE_ACCOUNT_JSON: "{{ service_account_json }}"
      GCP_PROJECT_ID: "{{ project_id }}"
      GOOGLE_APPLICATION_CREDENTIALS: "/tmp/gcp_sa_{{ tower_job_id }}.json"
    file:
      - template: "{{ service_account_json }}"
        destination: "/tmp/gcp_sa_{{ tower_job_id }}.json"
        mode: "0600"

