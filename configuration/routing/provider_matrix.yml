---
# Central Provider Routing Matrix (docs/architecture/provider-abstraction.md)
# Maps cloud_provider to its image resolver, provisioning role, stage playbooks,
# required collections, and dynamic inventory connection strategy.

providers:
  gcp:
    name: "Google Cloud Platform"
    # GCP is the managed Linux build path implemented in this repository.
    supported_os: [linux]
    provisioning_mode: managed
    os_config: "configuration/os/linux.yml"
    image_catalog: "configuration/images/linux_images.yml"
    image_catalog_key: gcp
    post_provision_roles:
      - "os/linux_baseline"
      - "domain/linux_domain_join"
      - "security/cis_linux"
      - "monitoring/monitoring_agent"
      - "security/security_agent"
      - "dns/dns_registration"
      - "cmdb/servicenow_cmdb"
    cloud_config: "configuration/clouds/gcp.yml"
    image_resolver_role: "image/gcp_image"
    provision_role: "provider/gcp_compute"
    provision_playbook: "playbooks/stages/provision_gcp.yml"
    post_build_playbook: "playbooks/post_build/linux_post_build.yml"
    required_collections:
      - "google.cloud"
      - "ansible.posix"
      - "community.general"
      - "community.crypto"
    inventory:
      target_group: "target_servers"
      linux_group: "linux_servers"
      provider_group: "gcp_servers"
      connection_type: "ssh"
      default_user: "sba"
      use_os_login: true
      gather_facts: true
      python_interpreter: "/usr/bin/python3"
      ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  azure:
    name: "Microsoft Azure"
    cloud_config: "configuration/clouds/azure.yml"
    image_resolver_role: "image/azure_image"
    provision_role: "provider/azure_vm"
    provision_playbook: "playbooks/stages/provision_azure.yml"
    post_build_playbook: "playbooks/post_build/linux_post_build.yml"
    required_collections:
      - "azure.azcollection"
      - "ansible.posix"
      - "community.general"
    inventory:
      connection_type: "ssh"
      default_user: "azureuser"
      gather_facts: true
      python_interpreter: "/usr/bin/python3"
      ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  aws:
    name: "Amazon Web Services"
    cloud_config: "configuration/clouds/aws.yml"
    image_resolver_role: "image/aws_image"
    provision_role: "provider/aws_ec2"
    provision_playbook: "playbooks/stages/provision_aws.yml"
    post_build_playbook: "playbooks/post_build/linux_post_build.yml"
    required_collections:
      - "amazon.aws"
      - "ansible.posix"
      - "community.general"
    inventory:
      connection_type: "ssh"
      default_user: "ec2-user"
      gather_facts: true
      python_interpreter: "/usr/bin/python3"
      ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  vmware:
    name: "VMware vSphere"
    cloud_config: "configuration/clouds/vmware.yml"
    image_resolver_role: "image/vmware_image"
    provision_role: "provider/vmware_vm"
    provision_playbook: "playbooks/stages/provision_vmware.yml"
    post_build_playbook: "playbooks/post_build/linux_post_build.yml"
    required_collections:
      - "community.vmware"
      - "ansible.posix"
      - "community.general"
    inventory:
      connection_type: "ssh"
      default_user: "ansible"
      gather_facts: true
      python_interpreter: "/usr/bin/python3"
      ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  hyperv:
    name: "Microsoft Hyper-V"
    cloud_config: "configuration/clouds/hyperv.yml"
    image_resolver_role: "image/hyperv_image"
    provision_role: "provider/hyperv_vm"
    provision_playbook: "playbooks/stages/provision_hyperv.yml"
    post_build_playbook: "playbooks/post_build/linux_post_build.yml"
    required_collections:
      - "community.windows"
      - "ansible.windows"
      - "ansible.posix"
      - "community.general"
    inventory:
      connection_type: "ssh"
      default_user: "ansible"
      gather_facts: true
      python_interpreter: "/usr/bin/python3"
      ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  nutanix:
    name: "Nutanix AHV"
    cloud_config: "configuration/clouds/nutanix.yml"
    image_resolver_role: "image/nutanix_image"
    provision_role: "provider/nutanix_vm"
    provision_playbook: "playbooks/stages/provision_nutanix.yml"
    post_build_playbook: "playbooks/post_build/linux_post_build.yml"
    required_collections:
      - "nutanix.ncp"
      - "ansible.posix"
      - "community.general"
    inventory:
      connection_type: "ssh"
      default_user: "ansible"
      gather_facts: true
      python_interpreter: "/usr/bin/python3"
      ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  # Hybrid-cloud targets are supplied by an approved inventory. There is no
  # generic create operation; the route exists for the Linux post-build plan.
  hybridcloud:
    name: "Hybrid Cloud (inventory managed)"
    supported_os: [linux]
    provisioning_mode: inventory_only
    cloud_config: "configuration/clouds/hybridcloud.yml"
    os_config: "configuration/os/linux.yml"
    image_catalog: "configuration/images/linux_images.yml"
    image_catalog_key: hybridcloud
    post_build_playbook: "playbooks/post_build/linux_post_build.yml"
    post_provision_roles:
      - "os/linux_baseline"
      - "domain/linux_domain_join"
      - "security/cis_linux"
      - "monitoring/monitoring_agent"
      - "security/security_agent"
      - "dns/dns_registration"
      - "cmdb/servicenow_cmdb"
    required_collections:
      - "ansible.posix"
      - "community.general"
    inventory:
      target_group: "target_servers"
      linux_group: "linux_servers"
      provider_group: "hybridcloud_servers"
      connection_type: "ssh"
      default_user: "ansible"
      gather_facts: true
      python_interpreter: "/usr/bin/python3"
      ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
